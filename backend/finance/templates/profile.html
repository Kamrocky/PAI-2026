{% extends "base.html" %}

{% block title %}CoinZen{% endblock %}

{% block nav_right %}
  {% include "partials/nav_user_info.html" %}
{% endblock %}

{% block content %}
<div id="page-content">
  <div class="mb-4">
    <a
      href="{{ back_url }}"
      class="inline-flex items-center gap-1.5 text-sm text-zinc-400 transition-colors hover:text-zinc-100"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
      Wróć
    </a>
  </div>

  <div class="rounded-2xl border border-white/10 bg-zinc-900/70 p-6 shadow-lg shadow-black/20 backdrop-blur-sm">
    <h2 class="mb-6 text-xl font-semibold text-zinc-100">Twój profil</h2>
    <div hx-get="/api/ui/profile" hx-trigger="load" hx-swap="outerHTML"></div>
  </div>
</div>
{% endblock %}
