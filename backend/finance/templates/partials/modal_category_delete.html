{% if delete_confirm_category %}
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="w-full max-w-sm rounded-2xl border border-zinc-700 bg-zinc-900 p-6 shadow-2xl">
    <h3 class="mb-2 text-lg font-semibold text-zinc-100">Usuń kategorię</h3>
    <p class="mb-6 text-sm text-zinc-400">
      Czy na pewno chcesz usunąć kategorię
      <span class="font-medium text-zinc-100">{{ delete_confirm_category.name }}</span>?
      Transakcje z tą kategorią zostaną bez kategorii.
    </p>
    <div class="flex gap-3">
      <button hx-delete="/api/ui/categories/{{ delete_confirm_category.id }}"
              hx-target="#categories-section"
              hx-swap="outerHTML"
              class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-500 transition-colors">
        Usuń
      </button>
      <button hx-get="/api/ui/categories"
              hx-target="#categories-section"
              hx-swap="outerHTML"
              class="rounded-lg border border-zinc-700 px-4 py-2 text-sm text-zinc-400 hover:border-zinc-500 hover:text-zinc-100 transition-colors">
        Anuluj
      </button>
    </div>
  </div>
</div>
{% endif %}
