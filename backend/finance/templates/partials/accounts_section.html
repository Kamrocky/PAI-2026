<section id="accounts-section" class="rounded-lg border border-gray-200 p-4">
    <h3 class="text-lg font-semibold text-gray-800">Konta</h3>
    <p class="mt-2 text-sm text-gray-500">Zarządzanie kontami — formularze w kolejnym commicie.</p>
    {% if accounts %}
    <ul class="mt-3 space-y-1 text-sm">
        {% for acc in accounts %}
        <li>{{ acc.name }} — <span class="font-mono">{{ acc.balance }} {{ acc.currency }}</span></li>
        {% endfor %}
    </ul>
    {% endif %}
</section>
