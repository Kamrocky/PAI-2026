<div class="text-center">
    <h2 class="text-2xl font-bold text-gray-900">Utwórz konto</h2>
    <p class="mt-2 text-sm text-gray-500">Nie znaleźliśmy konta dla tego adresu.</p>
    <p class="mt-3 inline-block rounded-full bg-gray-100 px-3 py-1 text-sm font-mono text-gray-700">
        {{ email }}
    </p>

    <form hx-post="/api/auth/register"
          hx-target="#main-content"
          hx-swap="innerHTML"
          class="mt-6 space-y-4 text-left text-sm">
        {% csrf_token %}
        <input type="hidden" name="email" value="{{ email }}">
        <label class="block">
            <span class="mb-1 block text-xs font-medium text-gray-600">Imię</span>
            <input type="text"
                   name="first_name"
                   placeholder="Jak mamy się do Ciebie zwracać?"
                   autocomplete="given-name"
                   autofocus
                   required
                   class="w-full rounded border border-gray-300 p-2 focus:border-blue-500 focus:outline-none">
        </label>
        <label class="block">
            <span class="mb-1 block text-xs font-medium text-gray-600">Hasło</span>
            <input type="password"
                   name="password"
                   placeholder="Minimum 8 znaków"
                   autocomplete="new-password"
                   required
                   class="w-full rounded border border-gray-300 p-2 focus:border-blue-500 focus:outline-none">
        </label>
        <label class="block">
            <span class="mb-1 block text-xs font-medium text-gray-600">Powtórz hasło</span>
            <input type="password"
                   name="password_confirm"
                   placeholder="Powtórz hasło"
                   autocomplete="new-password"
                   required
                   class="w-full rounded border border-gray-300 p-2 focus:border-blue-500 focus:outline-none">
        </label>
        <button type="submit"
                class="w-full rounded bg-green-600 px-4 py-2 text-white hover:bg-green-700">
            Utwórz konto
        </button>
    </form>

    <button type="button"
            hx-get="/api/auth"
            hx-target="#main-content"
            hx-swap="innerHTML"
            class="mt-4 text-sm text-blue-600 hover:underline">
        Użyj innego adresu e-mail
    </button>
</div>
