<div class="text-center">
    {% if error %}
    <div class="mb-4 rounded border border-red-200 bg-red-50 p-3 text-sm text-red-700" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <h2 class="text-2xl font-bold mb-2">Utwórz konto</h2>
    <p class="mb-4 text-sm text-gray-600">{{ email }}</p>
    <form hx-post="/api/auth/register"
          hx-target="#main-content"
          hx-swap="innerHTML"
          class="space-y-4 max-w-xs mx-auto text-sm">
        {% csrf_token %}
        <input type="hidden" name="email" value="{{ email }}">
        <input type="text" name="first_name" placeholder="Imię" autocomplete="given-name"
               class="w-full border p-2 rounded" required>
        <input type="password" name="password" placeholder="Hasło" autocomplete="new-password"
               class="w-full border p-2 rounded" required>
        <input type="password" name="password_confirm" placeholder="Powtórz hasło" autocomplete="new-password"
               class="w-full border p-2 rounded" required>
        <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-700">
            Utwórz konto
        </button>
    </form>
    <button type="button"
            hx-get="/api/auth"
            hx-target="#main-content"
            hx-swap="innerHTML"
            class="mt-4 text-sm text-blue-600 hover:underline">
        Użyj innego adresu e-mail
    </button>
</div>
