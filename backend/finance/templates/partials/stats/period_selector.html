<div class="inline-flex flex-wrap items-center gap-1 rounded-lg border border-white/10 bg-zinc-900/50 p-1" role="group" aria-label="Zakres czasu">
  {% for key, label, days in period_options %}
    <form hx-post="/api/ui/stats/period" hx-target="#stats-content" hx-swap="outerHTML" class="inline-flex">
      {% csrf_token %}
      <input type="hidden" name="period" value="{{ key }}" />
      <button
        type="submit"
        class="rounded-md px-3 py-1.5 text-xs font-medium transition-colors {% if key == active_period %}bg-emerald-500/15 text-emerald-200{% else %}text-zinc-400 hover:bg-white/5 hover:text-zinc-200{% endif %}"
      >
        {{ label }}
      </button>
    </form>
  {% endfor %}
</div>
