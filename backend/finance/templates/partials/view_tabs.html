{% with current_tab=active_tab|default:request.resolver_match.url_name %}
<nav class="flex items-end gap-1" aria-label="Główne widoki">
  <a
    href="{% url 'home' %}"
    class="rounded-t-lg border border-white/10 px-4 py-2 text-sm font-medium transition-colors {% if current_tab == 'home' %}relative z-10 -mb-px border-b-0 bg-zinc-900/70 text-emerald-300{% else %}mb-0 border-b-transparent bg-zinc-900/35 text-zinc-400 hover:bg-zinc-900/50 hover:text-zinc-200{% endif %}"
  >
    Home
  </a>
  <a
    href="{% url 'stats' %}"
    class="rounded-t-lg border border-white/10 px-4 py-2 text-sm font-medium transition-colors {% if current_tab == 'stats' %}relative z-10 -mb-px border-b-0 bg-zinc-900/70 text-emerald-300{% else %}mb-0 border-b-transparent bg-zinc-900/35 text-zinc-400 hover:bg-zinc-900/50 hover:text-zinc-200{% endif %}"
  >
    Statystyki
  </a>
  <a
    href="{% url 'categories' %}"
    class="rounded-t-lg border border-white/10 px-4 py-2 text-sm font-medium transition-colors {% if current_tab == 'categories' %}relative z-10 -mb-px border-b-0 bg-zinc-900/70 text-emerald-300{% else %}mb-0 border-b-transparent bg-zinc-900/35 text-zinc-400 hover:bg-zinc-900/50 hover:text-zinc-200{% endif %}"
  >
    Kategorie
  </a>
</nav>
{% endwith %}
