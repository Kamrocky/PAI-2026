{% for category in category_list %}
<div class="flex flex-col gap-3 rounded-lg border border-white/10 bg-white/5 p-3">
  <div class="flex items-center gap-2">
    <span class="h-2.5 w-2.5 shrink-0 rounded-full" style="background-color: {{ category.color }}"></span>
    <span class="truncate text-sm font-medium text-zinc-100">{{ category.name }}</span>
  </div>
  <div class="flex justify-end gap-1">
    <button
      type="button"
      hx-get="/api/ui/categories/{{ category.id }}/edit"
      hx-target="#home-modal"
      hx-swap="innerHTML"
      class="shrink-0 rounded-lg p-2 text-zinc-400 transition-colors hover:bg-white/10 hover:text-zinc-200"
      aria-label="Edytuj kategorię {{ category.name }}"
    >
      {% include "partials/ui/icon_edit.html" %}
    </button>
    <button
      type="button"
      hx-get="/api/ui/categories/{{ category.id }}/delete-confirm"
      hx-target="#home-modal"
      hx-swap="innerHTML"
      class="shrink-0 rounded-lg p-2 text-zinc-400 transition-colors hover:bg-rose-500/10 hover:text-rose-300"
      aria-label="Usuń kategorię {{ category.name }}"
    >
      {% include "partials/ui/icon_delete.html" %}
    </button>
  </div>
</div>
{% endfor %}
