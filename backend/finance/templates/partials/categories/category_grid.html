{% for category in category_list %}
<div class="flex flex-col gap-3 rounded-xl border border-white/10 bg-zinc-950/30 p-3">
  <div class="flex items-center gap-2">
    <span class="h-3 w-3 shrink-0 rounded-full" style="background-color: {{ category.color }}"></span>
    <span class="truncate text-sm font-medium text-zinc-100">{{ category.name }}</span>
  </div>
  <div class="flex justify-end gap-2">
    <button
      hx-get="/api/ui/categories/{{ category.id }}/edit"
      hx-target="#home-modal"
      hx-swap="innerHTML"
      title="Edytuj"
      class="text-zinc-400 transition-colors hover:text-zinc-100"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
    <button
      hx-get="/api/ui/categories/{{ category.id }}/delete-confirm"
      hx-target="#home-modal"
      hx-swap="innerHTML"
      title="Usuń"
      class="text-rose-400 transition-colors hover:text-rose-300"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
    </button>
  </div>
</div>
{% endfor %}
