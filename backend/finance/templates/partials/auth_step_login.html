<div class="text-center">
    <h2 class="text-2xl font-bold text-gray-900">Witaj ponownie</h2>
    <p class="mt-2 text-sm text-gray-500">Zaloguj się na konto</p>
    <p class="mt-3 inline-block rounded-full bg-gray-100 px-3 py-1 text-sm font-mono text-gray-700">
        {{ email }}
    </p>

    <form hx-post="/api/auth/login"
          hx-target="#main-content"
          hx-swap="innerHTML"
          class="mt-6 space-y-4 text-left">
        {% csrf_token %}
        <input type="hidden" name="email" value="{{ email }}">
        <label class="block">
            <span class="mb-1 block text-xs font-medium text-gray-600">Hasło</span>
            <input type="password"
                   name="password"
                   placeholder="Twoje hasło"
                   autocomplete="current-password"
                   autofocus
                   required
                   class="w-full rounded border border-gray-300 p-2 focus:border-blue-500 focus:outline-none">
        </label>
        <button type="submit"
                class="w-full rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">
            Zaloguj się
        </button>
    </form>

    <button type="button"
            hx-get="/api/auth"
            hx-target="#main-content"
            hx-swap="innerHTML"
            class="mt-4 text-sm text-blue-600 hover:underline">
        Użyj innego adresu e-mail
    </button>
</div>
