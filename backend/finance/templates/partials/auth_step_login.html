<div class="text-center">
    <h2 class="text-2xl font-semibold tracking-tight text-zinc-50">Witaj ponownie</h2>
    <p class="mt-2 text-sm text-zinc-300">Zaloguj się na konto</p>
    <p class="mt-3 inline-block rounded-full border border-white/10 bg-white/5 px-3 py-1 text-sm font-mono text-zinc-200">
        {{ email }}
    </p>

    <form hx-post="/api/auth/login"
          hx-target="#page-content"
          hx-swap="innerHTML"
          class="mt-6 space-y-4 text-left">
        {% csrf_token %}
        <input type="hidden" name="email" value="{{ email }}">
        <div class="block">
            <span class="mb-1 block text-xs font-medium text-zinc-300">Hasło</span>
            {% include "partials/ui/password_input.html" with name="password" placeholder="Twoje hasło" autocomplete="current-password" required=True autofocus=True %}
        </div>
        <button type="submit"
                class="w-full rounded-lg bg-emerald-500 px-4 py-2 font-medium text-zinc-950 hover:bg-emerald-400">
            Zaloguj się
        </button>
    </form>

    <button type="button"
            hx-get="/api/auth"
            hx-target="#page-content"
            hx-swap="innerHTML"
            class="mt-4 text-sm text-emerald-300 hover:text-emerald-200 hover:underline">
        Użyj innego adresu e-mail
    </button>
</div>
