{% if error %}
<div class="mb-4 rounded border border-red-200 bg-red-50 p-3 text-sm text-red-700" role="alert">
    {{ error }}
</div>
{% endif %}
{% if success %}
<div class="mb-4 rounded border border-green-200 bg-green-50 p-3 text-sm text-green-700" role="status">
    {{ success }}
</div>
{% endif %}
