{% if error %}
<div class="alert-auto-dismiss pointer-events-none fixed inset-x-0 top-20 z-50 flex justify-center px-4" role="alert">
  <div class="rounded-lg border border-red-500/30 bg-zinc-900/95 px-4 py-3 text-sm text-red-200 shadow-xl backdrop-blur-sm">
    {{ error }}
  </div>
</div>
{% endif %}
{% if success %}
<div class="alert-auto-dismiss pointer-events-none fixed inset-x-0 top-20 z-50 flex justify-center px-4" role="status">
  <div class="rounded-lg border border-emerald-500/30 bg-zinc-900/95 px-4 py-3 text-sm text-emerald-200 shadow-xl backdrop-blur-sm">
    {{ success }}
  </div>
</div>
{% endif %}
