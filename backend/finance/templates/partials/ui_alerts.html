{% if error %}
<div class="mb-4 rounded-lg border border-red-500/30 bg-red-500/10 p-3 text-sm text-red-200" role="alert">
    {{ error }}
</div>
{% endif %}
{% if success %}
<div class="mb-4 rounded-lg border border-emerald-500/30 bg-emerald-500/10 p-3 text-sm text-emerald-200" role="status">
    {{ success }}
</div>
{% endif %}
