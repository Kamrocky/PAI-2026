{% if error %}
<div class="mb-4 rounded-lg border border-red-500/30 bg-red-950/40 px-4 py-3 text-sm text-red-300" role="alert">
  {{ error }}
</div>
{% endif %}
{% if success %}
<div class="mb-4 rounded-lg border border-emerald-500/30 bg-emerald-950/40 px-4 py-3 text-sm text-emerald-300" role="status">
  {{ success }}
</div>
{% endif %}
