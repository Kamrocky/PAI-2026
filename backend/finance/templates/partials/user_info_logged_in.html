<div id="user-info" hx-swap-oob="innerHTML" class="flex items-center gap-4">
    <span class="text-white/90">Witaj, {{ user.username }}</span>
    <form hx-post="/api/auth/logout"
          hx-target="#main-content"
          hx-swap="innerHTML"
          class="inline">
        {% csrf_token %}
        <button type="submit" class="rounded bg-white/20 px-3 py-1 text-sm hover:bg-white/30">
            Wyloguj
        </button>
    </form>
</div>
