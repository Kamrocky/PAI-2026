<div id="user-info" hx-swap-oob="innerHTML" class="flex items-center gap-4 text-sm text-zinc-200">
    <span class="hidden sm:inline">Witaj, {{ display_name }}</span>
    <form hx-post="/api/auth/logout"
          hx-target="#page-content"
          hx-swap="innerHTML"
          class="inline">
        {% csrf_token %}
        <button type="submit" class="rounded-lg border border-white/10 bg-white/5 px-3 py-1.5 hover:bg-white/10">
            Wyloguj
        </button>
    </form>
</div>
