<div class="relative password-wrapper">
  <input
    type="password"
    name="{{ name }}"
    placeholder="{{ placeholder }}"
    {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
    {% if required %}required{% endif %}
    {% if autofocus %}autofocus{% endif %}
    class="w-full rounded-lg border border-white/10 bg-zinc-950/40 py-2 pl-3 pr-10 text-zinc-100 placeholder:text-zinc-400 focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-400/20"
  />
  {% include "partials/ui/password_toggle_btn.html" %}
</div>
