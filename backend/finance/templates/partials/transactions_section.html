<section id="transactions-section" class="rounded-lg border border-gray-200 p-4">
    <h3 class="text-lg font-semibold text-gray-800">Transakcje</h3>
    <p class="mt-2 text-sm text-gray-500">Zarządzanie transakcjami — formularze w kolejnym commicie.</p>
    {% if transactions %}
    <ul class="mt-3 space-y-1 text-sm">
        {% for t in transactions %}
        <li>
            {{ t.title }}
            <span class="{% if t.amount < 0 %}text-red-500{% else %}text-green-600{% endif %} font-mono">
                ({{ t.amount }})
            </span>
        </li>
        {% endfor %}
    </ul>
    {% endif %}
</section>
