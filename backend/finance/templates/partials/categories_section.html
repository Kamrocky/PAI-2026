<section id="categories-section" class="rounded-lg border border-gray-200 p-4">
    <h3 class="text-lg font-semibold text-gray-800">Kategorie</h3>
    <p class="mt-2 text-sm text-gray-500">Zarządzanie kategoriami — formularze w kolejnym commicie.</p>
    {% if categories %}
    <ul class="mt-3 space-y-1 text-sm">
        {% for cat in categories %}
        <li class="flex items-center gap-2">
            <span class="inline-block h-3 w-3 rounded-full" style="background-color: {{ cat.color }}"></span>
            {{ cat.name }}
            {% if cat.is_income %}<span class="text-xs text-green-600">(przychód)</span>{% endif %}
        </li>
        {% endfor %}
    </ul>
    {% endif %}
</section>
