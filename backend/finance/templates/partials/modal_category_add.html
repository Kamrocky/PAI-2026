{% if show_add_modal %}
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="w-full max-w-md rounded-2xl border border-zinc-700 bg-zinc-900 p-6 shadow-2xl">
    <h3 class="mb-4 text-lg font-semibold text-zinc-100">Nowa kategoria</h3>
    <form hx-post="/api/ui/categories"
          hx-target="#categories-section"
          hx-swap="outerHTML">
      {% csrf_token %}
      {% include "partials/category_form_fields.html" %}
      <div class="mt-6 flex gap-3">
        <button type="submit"
                class="rounded-lg bg-green-600 px-4 py-2 text-sm font-medium text-white hover:bg-green-500 transition-colors">
          Zapisz
        </button>
        <button type="button"
                hx-get="/api/ui/categories"
                hx-target="#categories-section"
                hx-swap="outerHTML"
                class="rounded-lg border border-zinc-700 px-4 py-2 text-sm text-zinc-400 hover:border-zinc-500 hover:text-zinc-100 transition-colors">
          Anuluj
        </button>
      </div>
    </form>
  </div>
</div>
{% endif %}
