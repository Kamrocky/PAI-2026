<nav class="mt-4 flex flex-wrap items-center justify-center gap-1" aria-label="Paginacja transakcji">
  {% if transactions_page.page > 1 %}
    <a
      href="#"
      hx-get="/api/ui/home/transactions?page={{ transactions_page.page|add:'-1' }}"
      hx-target="#home-transactions"
      hx-swap="outerHTML"
      class="rounded-lg border border-white/10 bg-white/5 px-3 py-1.5 text-sm text-zinc-300 hover:bg-white/10"
    >
      ←
    </a>
  {% endif %}

  {% for page_num in transactions_page.page_numbers %}
    <a
      href="#"
      hx-get="/api/ui/home/transactions?page={{ page_num }}"
      hx-target="#home-transactions"
      hx-swap="outerHTML"
      class="min-w-[2rem] rounded-lg border px-2 py-1.5 text-center text-sm {% if page_num == transactions_page.page %}border-emerald-400/50 bg-emerald-500/15 text-emerald-100{% else %}border-white/10 bg-white/5 text-zinc-300 hover:bg-white/10{% endif %}"
      {% if page_num == transactions_page.page %}aria-current="page"{% endif %}
    >
      {{ page_num }}
    </a>
  {% endfor %}

  {% if transactions_page.page < transactions_page.num_pages %}
    <a
      href="#"
      hx-get="/api/ui/home/transactions?page={{ transactions_page.page|add:'1' }}"
      hx-target="#home-transactions"
      hx-swap="outerHTML"
      class="rounded-lg border border-white/10 bg-white/5 px-3 py-1.5 text-sm text-zinc-300 hover:bg-white/10"
    >
      →
    </a>
  {% endif %}
</nav>
