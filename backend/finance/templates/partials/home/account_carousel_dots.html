<div class="flex items-center justify-center gap-2 pt-1" role="tablist" aria-label="Wybór konta">
  <form
    hx-post="/api/ui/home/navigate-account"
    hx-target="#home-content"
    hx-swap="outerHTML"
    class="inline-flex shrink-0"
  >
    {% csrf_token %}
    <input type="hidden" name="direction" value="prev" />
    <button
      type="submit"
      {% if not can_go_prev %}disabled{% endif %}
      aria-label="Poprzednie konto"
      class="rounded-lg p-2 text-zinc-300 transition-colors enabled:hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-30"
    >
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.832 10l3.938 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd" />
      </svg>
    </button>
  </form>

  <div class="flex items-center gap-1">
    {% if accounts %}
      {% for account in accounts %}
        <form
          hx-post="/api/ui/home/select-slot"
          hx-target="#home-content"
          hx-swap="outerHTML"
          class="inline-flex"
        >
          {% csrf_token %}
          <input type="hidden" name="slot_index" value="{{ forloop.counter0 }}" />
          <button
            type="submit"
            role="tab"
            aria-selected="{% if not is_create_slot and active_account and active_account.id == account.id %}true{% else %}false{% endif %}"
            aria-label="Konto {{ account.name }}"
            class="rounded-full p-2 transition-opacity hover:opacity-100 {% if not is_create_slot and active_account and active_account.id == account.id %}opacity-100{% else %}opacity-60{% endif %}"
          >
            <span
              class="block h-1.5 w-1.5 rounded-full {% if not is_create_slot and active_account and active_account.id == account.id %}bg-emerald-400{% else %}bg-zinc-500 hover:bg-zinc-300{% endif %}"
            ></span>
          </button>
        </form>
      {% endfor %}
      <form
        hx-post="/api/ui/home/select-slot"
        hx-target="#home-content"
        hx-swap="outerHTML"
        class="inline-flex"
      >
        {% csrf_token %}
        <input type="hidden" name="slot_index" value="{{ accounts|length }}" />
        <button
          type="submit"
          role="tab"
          aria-selected="{% if is_create_slot %}true{% else %}false{% endif %}"
          aria-label="Nowe konto"
          class="rounded-full p-2 transition-opacity hover:opacity-100 {% if is_create_slot %}opacity-100{% else %}opacity-60{% endif %}"
        >
          <span
            class="block h-1.5 w-1.5 rounded-full {% if is_create_slot %}bg-emerald-400{% else %}bg-zinc-500 hover:bg-zinc-300{% endif %}"
          ></span>
        </button>
      </form>
    {% else %}
      <form
        hx-post="/api/ui/home/select-slot"
        hx-target="#home-content"
        hx-swap="outerHTML"
        class="inline-flex"
      >
        {% csrf_token %}
        <input type="hidden" name="slot_index" value="0" />
        <button
          type="submit"
          role="tab"
          aria-selected="true"
          aria-label="Nowe konto"
          class="rounded-full p-2 opacity-100"
        >
          <span class="block h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
        </button>
      </form>
    {% endif %}
  </div>

  <form
    hx-post="/api/ui/home/navigate-account"
    hx-target="#home-content"
    hx-swap="outerHTML"
    class="inline-flex shrink-0"
  >
    {% csrf_token %}
    <input type="hidden" name="direction" value="next" />
    <button
      type="submit"
      {% if not can_go_next %}disabled{% endif %}
      aria-label="Następne konto"
      class="rounded-lg p-2 text-zinc-300 transition-colors enabled:hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-30"
    >
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L11.168 10 7.23 6.29a.75.75 0 1 1 1.04-1.08l4.5 4.25a.75.75 0 0 1 0 1.08l-4.5 4.25a.75.75 0 0 1-1.06-.02Z" clip-rule="evenodd" />
      </svg>
    </button>
  </form>
</div>
