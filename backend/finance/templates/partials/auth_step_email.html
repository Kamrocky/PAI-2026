<div class="text-center">
    <h2 class="text-2xl font-bold text-gray-900">Witaj</h2>
    <p class="mt-2 text-sm text-gray-500">Podaj adres e-mail, aby się zalogować lub założyć konto.</p>

    <form hx-post="/api/auth/check-email"
          hx-target="#main-content"
          hx-swap="innerHTML"
          class="mt-6 space-y-4 text-left">
        {% csrf_token %}
        <label class="block">
            <span class="mb-1 block text-xs font-medium text-gray-600">Adres e-mail</span>
            <input type="email"
                   name="email"
                   value="{{ email }}"
                   placeholder="np. jan@example.com"
                   autocomplete="email"
                   autofocus
                   required
                   class="w-full rounded border border-gray-300 p-2 focus:border-blue-500 focus:outline-none">
        </label>
        <button type="submit"
                class="w-full rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">
            Dalej
        </button>
    </form>
</div>
