<div class="text-center">
    <h2 class="text-2xl font-semibold tracking-tight text-zinc-50">Witaj</h2>
    <p class="mt-2 text-sm text-zinc-300">Podaj adres e-mail, aby się zalogować lub założyć konto.</p>

    <form hx-post="/api/auth/check-email"
          hx-target="#page-content"
          hx-swap="innerHTML"
          class="mt-6 space-y-4 text-left">
        {% csrf_token %}
        <label class="block">
            <span class="mb-1 block text-xs font-medium text-zinc-300">Adres e-mail</span>
            <input type="email"
                   name="email"
                   value="{{ email }}"
                   placeholder="np. jan@example.com"
                   autocomplete="email"
                   autofocus
                   required
                   class="w-full rounded-lg border border-white/10 bg-zinc-950/40 p-2 text-zinc-100 placeholder:text-zinc-400 focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-400/20">
        </label>
        <button type="submit"
                class="w-full rounded-lg bg-emerald-500 px-4 py-2 font-medium text-zinc-950 hover:bg-emerald-400">
            Dalej
        </button>
    </form>
</div>
