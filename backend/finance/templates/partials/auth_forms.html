<div class="text-center">
    {% if error %}
    <div class="mb-4 rounded border border-red-200 bg-red-50 p-3 text-sm text-red-700" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <h2 class="text-2xl font-bold mb-4">Zaloguj się</h2>
    <form hx-post="/api/auth/login"
          hx-target="#main-content"
          hx-swap="innerHTML"
          class="space-y-4 max-w-xs mx-auto">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Login" autocomplete="username"
               class="w-full border p-2 rounded" required>
        <input type="password" name="password" placeholder="Hasło" autocomplete="current-password"
               class="w-full border p-2 rounded" required>
        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-700">
            Zaloguj się
        </button>
    </form>

    <hr class="my-8">

    <h2 class="text-xl font-bold mb-4">Nie masz konta? Zarejestruj się</h2>
    <form hx-post="/api/auth/register"
          hx-target="#main-content"
          hx-swap="innerHTML"
          class="space-y-4 max-w-xs mx-auto text-sm">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Nowy login" autocomplete="username"
               class="w-full border p-2 rounded" required>
        <input type="email" name="email" placeholder="Email (opcjonalnie)" autocomplete="email"
               class="w-full border p-2 rounded">
        <input type="password" name="password" placeholder="Hasło" autocomplete="new-password"
               class="w-full border p-2 rounded" required>
        <button type="submit" class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-700">
            Stwórz konto
        </button>
    </form>
</div>
