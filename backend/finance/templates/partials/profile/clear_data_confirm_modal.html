<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-950/80 p-4 backdrop-blur-sm"
  role="dialog"
  aria-modal="true"
  aria-labelledby="clear-data-title"
>
  <div
    data-home-modal-card
    class="w-full max-w-md rounded-xl border border-white/10 bg-zinc-900/95 p-6 shadow-xl"
  >
    <h2 id="clear-data-title" class="text-lg font-semibold text-zinc-50">Wyczyścić wszystkie dane?</h2>
    <p class="mt-3 text-sm leading-relaxed text-zinc-300">
      Zostaną trwale usunięte wszystkie konta, transakcje i kategorie powiązane z Twoim profilem.
      Konto użytkownika, imię i hasło pozostaną bez zmian. Tej operacji nie można cofnąć.
    </p>

    <div class="mt-6 flex flex-wrap gap-2">
      <form
        hx-post="/api/ui/profile/clear-data"
        hx-target="#profile-section"
        hx-swap="outerHTML"
      >
        {% csrf_token %}
        <button
          type="submit"
          class="rounded-lg bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-500"
        >
          Tak, wyczyść dane
        </button>
      </form>
      <button
        type="button"
        hx-get="/api/ui/home/modal/close"
        hx-target="#home-modal"
        hx-swap="innerHTML"
        class="rounded-lg border border-white/10 bg-white/5 px-4 py-2 text-sm text-zinc-200 hover:bg-white/10"
      >
        Anuluj
      </button>
    </div>
  </div>
</div>
